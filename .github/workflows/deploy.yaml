name: Deploy Gohoardings

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www
            git pull origin master

            docker stop new_goh || true
            docker rm new_goh || true

            docker build --no-cache -t new_goh:v1 .

            docker run -d --name new_goh --network host --restart unless-stopped new_goh:v1
